<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Couch Stream App — test manuel</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
  h1 { font-size: 1.2rem; }
  fieldset { border: 1px solid #444; border-radius: 8px; margin-bottom: 1rem; }
  button { padding: .5rem .8rem; margin: .2rem; cursor: pointer; }
  input[type=text] { padding: .4rem; margin: .2rem; }
  #log { background: #000; color: #0f0; font-family: monospace; font-size: .8rem; height: 240px; overflow-y: auto; padding: .5rem; white-space: pre-wrap; }
  #status { font-weight: bold; }
  .connected { color: #4f4; }
  .disconnected { color: #f44; }
</style>
</head>
<body>
<h1>Couch Stream App — client de test (Phase 1)</h1>

<fieldset>
  <legend>Connexion</legend>
  <input type="text" id="host" placeholder="127.0.0.1" value="127.0.0.1">
  <input type="text" id="port" placeholder="8765" value="8765">
  <input type="text" id="token" placeholder="LOCAL_WS_TOKEN" size="40">
  <button onclick="connect()">Connecter</button>
  <span id="status" class="disconnected">déconnecté</span>
</fieldset>

<fieldset>
  <legend>OBS</legend>
  <button onclick="cmd('state.get')">Rafraîchir état</button>
  <button onclick="cmd('obs.startStream')">Start stream</button>
  <button onclick="cmd('obs.stopStream')">Stop stream</button>
  <button onclick="cmd('obs.toggleMic')">Toggle micro</button>
  <div id="scenes"></div>
</fieldset>

<fieldset>
  <legend>Chat</legend>
  <input type="text" id="chatMsg" size="40" placeholder="message">
  <button onclick="sendChat()">Envoyer</button>
</fieldset>

<div id="log"></div>

<script>
let ws;
const log = (line) => {
  const el = document.getElementById('log');
  el.textContent += line + '\n';
  el.scrollTop = el.scrollHeight;
};
let nextId = 1;

function connect() {
  const host = document.getElementById('host').value;
  const port = document.getElementById('port').value;
  const token = document.getElementById('token').value;
  ws = new WebSocket(`ws://${host}:${port}`);

  ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', token }));
  ws.onclose = (e) => {
    document.getElementById('status').textContent = 'déconnecté';
    document.getElementById('status').className = 'disconnected';
    log(`[fermé] code=${e.code} ${e.reason}`);
  };
  ws.onerror = () => log('[erreur websocket]');
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'welcome') {
      document.getElementById('status').textContent = 'connecté';
      document.getElementById('status').className = 'connected';
    } else if (msg.type === 'state') {
      renderScenes(msg.scenes, msg.currentScene);
      log('[état] ' + JSON.stringify(msg));
    } else if (msg.type === 'event' && msg.name === 'chat.message') {
      log(`[chat] ${msg.displayName}: ${msg.text}`);
    } else {
      log('[msg] ' + JSON.stringify(msg));
    }
  };
}

function renderScenes(scenes, current) {
  const div = document.getElementById('scenes');
  div.innerHTML = '';
  for (const s of scenes || []) {
    const b = document.createElement('button');
    b.textContent = s + (s === current ? ' ●' : '');
    b.onclick = () => cmd('obs.switchScene', { sceneName: s });
    div.appendChild(b);
  }
}

function cmd(action, payload = {}) {
  const id = nextId++;
  ws.send(JSON.stringify({ type: 'command', id, action, payload }));
}

function sendChat() {
  const input = document.getElementById('chatMsg');
  cmd('chat.send', { message: input.value });
  input.value = '';
}
</script>
</body>
</html>
