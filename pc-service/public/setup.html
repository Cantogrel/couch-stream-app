<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Stream App — Configuration</title>
<style>
  :root { --bg:#0d0d10; --card:#1a1a1f; --border:#2a2a30; --fg:#eee; --dim:#9a9aa2; --ok:#4fd1a0; --bad:#f45b5b; --warn:#f5b942; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .3rem; }
  .sub { color: var(--dim); margin-bottom: 1.6rem; line-height: 1.5; }
  .step { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: .9rem; }
  .step.current { border-color: #3a3a44; }
  .head { display: flex; align-items: center; gap: .8rem; }
  .num { width: 1.8rem; height: 1.8rem; border-radius: 50%; background: #2a2a32; display: grid; place-items: center; font-size: .85rem; font-weight: 700; flex-shrink: 0; }
  .step.done .num { background: var(--ok); color: #06231a; }
  .head h2 { font-size: 1.05rem; margin: 0; flex: 1; }
  .badge { font-size: .78rem; color: var(--dim); }
  .step.done .badge { color: var(--ok); }
  .body { margin-top: .8rem; color: var(--dim); font-size: .9rem; line-height: 1.5; }
  .body b { color: var(--fg); }
  .step.done .body.collapsible { display: none; }
  button, a.btn { display: inline-block; margin: .5rem .5rem 0 0; background: var(--ok); color: #06231a; border: none; border-radius: 8px; padding: .6rem 1.1rem; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
  button.secondary, a.btn.secondary { background: #2a2a32; color: var(--fg); border: 1px solid var(--border); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  input { background: #101013; border: 1px solid var(--border); border-radius: 8px; color: var(--fg); padding: .55rem .7rem; font: inherit; width: 16rem; max-width: 100%; }
  .msg { margin-top: .5rem; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
  .code { font-size: 2rem; letter-spacing: .25em; font-weight: 800; color: var(--fg); background: #101013; border: 1px dashed #444; border-radius: 10px; padding: .5rem 1rem; display: inline-block; margin: .4rem 0; }
  .note { font-size: .78rem; margin-top: .6rem; }
  a { color: var(--ok); }
  img.qr { background: #fff; padding: 8px; border-radius: 8px; width: 200px; height: 200px; display: block; margin: .6rem 0; }
  .finish { text-align: center; margin-top: 1.5rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Bienvenue dans Couch Stream App</h1>
  <p class="sub">Quelques étapes pour piloter ton stream depuis le canapé. Chaque étape se vérifie toute seule ; tu peux fermer cette page et revenir plus tard, elle reprend où tu en étais.</p>
  <div id="steps"></div>
  <div class="finish"><button id="finishBtn" disabled>Terminer</button><div class="msg" id="finishMsg"></div></div>
</main>
<script src="setup.js"></script>
</body>
</html>
