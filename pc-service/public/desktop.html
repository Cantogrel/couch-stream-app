<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couch Stream App</title>
<style>
  :root { --bg:#0d0d10; --card:#1a1a1f; --border:#2a2a30; --fg:#eee; --dim:#9a9aa2; --ok:#4fd1a0; --bad:#f45b5b; --warn:#f5b942; --live:#f43f5e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header { display: flex; align-items: center; gap: 1.2rem; padding: .7rem 1.2rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 1.05rem; margin: 0; }
  .pills { display: flex; gap: .5rem; flex: 1; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: .45rem; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: .25rem .8rem; font-size: .8rem; color: var(--dim); }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  .live-badge { color: var(--live); font-weight: 700; font-size: .85rem; }
  .btn { background: #2a2a32; border: 1px solid var(--border); border-radius: 8px; padding: .45rem .9rem; font-size: .85rem; }
  .btn:hover { border-color: #444; }
  .btn.primary { background: var(--ok); color: #06231a; border: none; font-weight: 700; }
  .btn.danger { background: var(--live); color: #fff; border: none; font-weight: 700; }
  .btn:disabled { opacity: .45; cursor: default; }
  .hidden { display: none !important; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 1rem; padding: 1rem 1.2rem; }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: .9rem 1rem; }
  .card-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin-bottom: .6rem; }

  /* Hauteur bornée : l'aperçu doit tenir à l'écran sans scroller. */
  .preview { position: relative; aspect-ratio: 16 / 9; width: min(100%, calc(42vh * 16 / 9)); margin: 0 auto; background: #050507; border-radius: 10px; overflow: hidden; }
  .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; text-align: center; padding: 1.5rem; color: var(--dim); background: radial-gradient(circle at 50% 40%, #1b1b22, #0a0a0d); }
  .placeholder svg { width: 3rem; height: 3rem; opacity: .6; }
  .placeholder b { color: var(--fg); font-size: 1.05rem; }
  .placeholder p { margin: 0; font-size: .85rem; max-width: 26rem; line-height: 1.4; }

  .controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .stream-state { font-size: 1.2rem; font-weight: 700; }
  .stream-state.live { color: var(--live); }
  .duration { color: var(--dim); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
  .scene { padding: .7rem .5rem; text-align: center; }
  .scene.current { border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .health { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; text-align: center; }
  .health div { display: flex; flex-direction: column; gap: .15rem; }
  .health b { font-size: 1.05rem; }
  .health small { color: var(--dim); font-size: .7rem; }

  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: .8rem; }
  .chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .35rem; padding-right: .2rem; }
  .msg { font-size: .88rem; line-height: 1.35; padding: .35rem .5rem; border-radius: 8px; position: relative; word-break: break-word; }
  .msg:hover { background: #22222a; }
  .msg .author { font-weight: 700; margin-right: .4rem; }
  .msg .author.mod { color: var(--ok); } .msg .author.broadcaster { color: var(--warn); }
  .msg.deleted .text { color: var(--dim); font-style: italic; }
  .msg .tools { display: none; position: absolute; right: .3rem; top: -.6rem; gap: .25rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: .15rem; }
  .msg:hover .tools { display: flex; }
  .tools button { background: none; border: none; font-size: .72rem; padding: .2rem .45rem; border-radius: 5px; color: var(--dim); }
  .tools button:hover { background: #2a2a32; color: var(--fg); }
  .tools button.danger:hover { color: var(--bad); }
  .chat-form { display: flex; gap: .5rem; margin-top: .6rem; }
  .chat-form input { flex: 1; padding: .55rem .7rem; border-radius: 8px; border: 1px solid var(--border); background: #101013; color: var(--fg); font: inherit; }
  .empty { color: var(--dim); font-size: .85rem; text-align: center; margin: auto; padding: 1rem; }

  dialog { background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem 1.6rem; max-width: 460px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 .8rem; font-size: 1.1rem; }
  dialog img { display: block; margin: .8rem auto; background: #fff; padding: 12px; border-radius: 8px; width: 300px; height: 300px; image-rendering: pixelated; }
  dialog p { color: var(--dim); font-size: .85rem; line-height: 1.45; margin: .4rem 0; }
  dialog code { background: #101013; padding: .1rem .4rem; border-radius: 4px; color: var(--fg); }
  .tabs { display: flex; gap: .3rem; background: #101013; border-radius: 9px; padding: .2rem; margin-bottom: .6rem; }
  .tabs button { flex: 1; background: none; border: none; border-radius: 7px; padding: .4rem; font-size: .82rem; color: var(--dim); }
  .tabs button.active { background: #2a2a32; color: var(--fg); }
  .dev { display: flex; align-items: center; gap: .6rem; padding: .45rem 0; border-top: 1px solid var(--border); font-size: .85rem; }
  .dev .info { flex: 1; min-width: 0; } .dev small { display: block; color: var(--dim); font-size: .72rem; }
  .dev button { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--bad); font-size: .75rem; padding: .25rem .6rem; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: .4rem 0; border-top: 1px solid var(--border); font-size: .88rem; }

  #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--bad); color: #2a0808; padding: .6rem 1.1rem; border-radius: 8px; font-size: .85rem; z-index: 50; }

  @media (max-width: 900px) { main { grid-template-columns: 1fr; overflow-y: auto; } .col { overflow: visible; } .chat { min-height: 24rem; } }
</style>
</head>
<body>

<header>
  <h1>Couch Stream App</h1>
  <div class="pills">
    <span class="pill"><span class="dot" id="obsDot"></span>OBS</span>
    <span class="pill"><span class="dot" id="twDot"></span>Twitch</span>
    <span class="pill"><span class="dot" id="vbDot"></span>VB-Cable</span>
    <span class="pill"><span class="dot" id="phDot"></span><span id="phText">Téléphone</span></span>
  </div>
  <span id="liveBadge" class="live-badge hidden">● EN DIRECT</span>
  <button class="btn" id="settingsBtn">Téléphone &amp; infos</button>
</header>

<main>
  <div class="col">
    <div class="card">
      <div class="preview">
        <img id="preview" alt="Aperçu du live" class="hidden">
        <div id="placeholder" class="placeholder"></div>
      </div>
    </div>

    <div class="card">
      <div class="controls">
        <div>
          <div class="stream-state" id="streamState">Hors ligne</div>
          <div class="duration" id="duration"></div>
        </div>
        <span class="spacer"></span>
        <button class="btn" id="micBtn" disabled>Micro OBS : –</button>
        <button class="btn primary" id="streamBtn" disabled>Démarrer le stream</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Scènes</div>
      <div class="scenes" id="scenes"><span class="empty">OBS non connecté</span></div>
    </div>

    <div class="card">
      <div class="card-title">Santé du stream</div>
      <div class="health">
        <div><b id="hDropped">–</b><small>frames perdues</small></div>
        <div><b id="hTotal">–</b><small>frames totales</small></div>
        <div><b id="hCong">–</b><small>congestion</small></div>
        <div><b id="hKbps">–</b><small>kb/s</small></div>
        <div><b id="hFps">–</b><small>fps</small></div>
        <div><b id="hCpu">–</b><small>CPU OBS</small></div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="card chat">
      <div class="card-title">Chat</div>
      <div class="chat-log" id="chatLog"><div class="empty" id="chatEmpty">En attente du chat Twitch…</div></div>
      <form class="chat-form" id="chatForm">
        <input id="chatInput" placeholder="Écrire dans le chat…" autocomplete="off">
        <button class="btn primary" type="submit">Envoyer</button>
      </form>
    </div>
  </div>
</main>

<dialog id="dlg">
  <h2>Téléphone &amp; infos</h2>
  <div class="tabs">
    <button class="active" data-pane="pair">Jumeler</button>
    <button data-pane="apk">Installer l'app</button>
  </div>
  <div id="pairBox"><p>Chargement…</p></div>
  <div id="apkBox" class="hidden"></div>
  <div id="devBox"></div>
  <div class="row"><span>Téléphones connectés</span><b id="dlgPhones">0</b></div>
  <div class="row"><span>Version du service</span><b id="dlgVersion">–</b></div>
  <div style="text-align:right;margin-top:1rem"><button class="btn" id="dlgClose">Fermer</button></div>
</dialog>

<div id="toast" class="hidden"></div>
<script src="desktop.js"></script>
</body>
</html>
